# Cloud Build recipe for the cv-service image. Run by
# deploy/deploy-cv-service-cloudrun.sh — not by hand.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "-f", "cv-service/Dockerfile", "."]
images: ["${_IMAGE}"]
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
timeout: 3600s
